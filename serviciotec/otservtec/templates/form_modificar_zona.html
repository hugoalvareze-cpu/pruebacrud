{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="mb-3">
        <a href="{% url 'lista_zona' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver a Lista de Zonas
        </a>
    </div>
    
    <h2 class="mb-4 text-center">Modificar Zona: {{ zona.zona }}</h2>

    <div class="card shadow-sm p-4 col-md-6 mx-auto">
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre de la Zona</label>
                {{ form.zona }}
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-warning px-4">Actualizar Cambios</button>
                <a href="{% url 'lista_zona' %}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
