{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="mb-3">
        <a href="{% url 'lista_cliente' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver a Lista de Clientes
        </a>
    </div>
    
    <h2 class="mb-4 text-center">Registrar Nuevo Cliente</h2>

    <div class="card shadow-sm p-4 col-md-8 mx-auto">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Nombre</label>
                    {{ form.nombre_cliente }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Apellido</label>
                    {{ form.apellido_cli }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Email</label>
                    {{ form.email_cliente }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Teléfono</label>
                    {{ form.telefono }}
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Guardar Cliente</button>
                <a href="{% url 'lista_cliente' %}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
